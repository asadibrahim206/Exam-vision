[project]
name = "proctor-detector"
version = "0.1.0"
description = "YOLO-based cheating detector that reports flags to the proctor-backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.9",
    "httpx>=0.27",
    "lapx>=0.5.11",
    "pydantic-settings>=2.2",
]

[project.scripts]
detector = "detector.main:main"
detector-grab = "detector.grab:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]
